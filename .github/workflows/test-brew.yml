name: Test brew install
on: workflow_dispatch
jobs:
  brew:
    runs-on: macos-15-intel
    steps:
      - name: Install from the tap
        run: |
          brew tap brucewindsornz-sudo/notchpad https://github.com/brucewindsornz-sudo/notchpad
          brew trust brucewindsornz-sudo/notchpad
          brew install --cask notchpad
          test -d /Applications/NotchPad.app
          xattr -l /Applications/NotchPad.app | grep -q quarantine && { echo "still quarantined"; exit 1; } || echo "no quarantine"
          open /Applications/NotchPad.app; sleep 6; pgrep -x NotchPad
      - name: Uninstall
        run: brew uninstall --cask --zap notchpad && test ! -d /Applications/NotchPad.app
