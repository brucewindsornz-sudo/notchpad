name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh --universal
      - name: Smoke test (launch and stay running)
        run: |
          open build/NotchPad.app
          sleep 8
          pgrep -x NotchPad
          pkill -x NotchPad || true
      - name: Make disk image
        run: ./make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchPad
          path: build/NotchPad.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/NotchPad.dmg --title "NotchPad $GITHUB_REF_NAME" \
            --notes "Download NotchPad.dmg, open it and drag NotchPad to Applications. First launch: right-click NotchPad › Open (it isn't Apple-notarised)."
