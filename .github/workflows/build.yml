name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh --universal
      - name: Check the window sits at the very top of the screen
        run: |
          NOTCHPAD_DEBUG=1 build/NotchPad.app/Contents/MacOS/NotchPad 2> frame.log &
          sleep 6; kill %1 || true
          cat frame.log
          grep NOTCHPAD_FRAME frame.log | head -1 | awk '{split($2,a,"=");split($3,b,"="); if (a[2]!=b[2]) {print "Window top " a[2] " is below screen top " b[2]; exit 1} else print "OK: window top matches screen top"}'
      - name: Smoke test (launch and stay running)
        run: |
          open build/NotchPad.app
          sleep 8
          pgrep -x NotchPad
          pkill -x NotchPad || true
      - name: Make disk image
        run: ./make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchPad
          path: build/NotchPad.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/NotchPad.dmg --title "NotchPad $GITHUB_REF_NAME" \
            --notes "Download NotchPad.dmg, open it and drag NotchPad to Applications. First launch: right-click NotchPad › Open (it isn't Apple-notarised)."
      - name: Point the Homebrew cask at this release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER=${GITHUB_REF_NAME#v}
          SHA=$(shasum -a 256 build/NotchPad.dmg | cut -d' ' -f1)
          git fetch origin master && git checkout -B master origin/master
          sed -i '' "s/^  version \".*\"/  version \"$VER\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/notchpad.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "Cask: notchpad $VER"; git push origin master; }
