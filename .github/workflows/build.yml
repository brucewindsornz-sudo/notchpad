name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh --universal
      - name: Smoke test (launch and stay running)
        run: |
          open build/NotchPad.app
          sleep 8
          pgrep -x NotchPad
          log show --last 1m --predicate 'process == "NotchPad"' --style compact | tail -20 || true
          pkill -x NotchPad
      - name: Package
        run: |
          cd build && ditto -c -k --keepParent NotchPad.app NotchPad.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NotchPad
          path: build/NotchPad.zip
