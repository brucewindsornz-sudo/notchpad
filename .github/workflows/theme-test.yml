name: Theme test
on: workflow_dispatch
jobs:
  themes:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - name: First launch (creates the sandbox container)
        run: |
          build/NotchPad.app/Contents/MacOS/NotchPad & sleep 4; pkill -x NotchPad || true
      - name: Load a Ghostty-format theme file
        run: |
          C=~/Library/Containers/com.newzeebuild.notchpad/Data
          mkdir -p "$C/Library/Application Support/NotchPad/Themes"
          cp "tests/Ayu Mirage" "$C/Library/Application Support/NotchPad/Themes/"
          defaults write "$C/Library/Preferences/com.newzeebuild.notchpad" theme "custom:Ayu Mirage"
          NOTCHPAD_DEBUG=1 NOTCHPAD_DEBUG_SETTINGS=1 NOTCHPAD_ALLOW_CAPTURE=1 build/NotchPad.app/Contents/MacOS/NotchPad 2> themes.log &
          sleep 8
          screencapture -x settings.png || true
          cat themes.log
          pgrep -x NotchPad >/dev/null && echo "still running with Settings open" || echo "NOT RUNNING"
          pkill -x NotchPad || true
          grep -q 'NOTCHPAD_THEMES custom=\["Ayu Mirage"\]' themes.log && echo "GHOSTTY THEME LOADED" || { echo "THEME NOT LOADED"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-screenshot
          path: '*.png'
