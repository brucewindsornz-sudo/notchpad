name: Trial
# Development only: every push to an fx-* branch type-checks, builds, and renders what the commit message asks for.
# Put one line like this in the commit message (all parts optional):
#   fx: close=stargate,matrix flight=gate themes=stargate,paper frames=24 floating shots=matrix,paper settings=theme live
# See tests/trial.sh for what each part does. Results are in the "trial" artifact of the run.
on:
  push:
    branches: ['fx-**']
concurrency:
  group: trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Type-check
        run: |
          swiftc -typecheck -target arm64-apple-macos13.0 Sources/*.swift > typecheck.log 2>&1 || true
          grep -E "error|warning: var|cannot|ambiguous" typecheck.log | head -150 || true
          ! grep -q "error:" typecheck.log
      - name: Build
        run: ./build.sh
      - name: Trial
        env:
          TRIAL_MSG: ${{ github.event.head_commit.message }}
        run: tests/trial.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial
          path: |
            out
            typecheck.log
