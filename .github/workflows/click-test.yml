name: Click test
on: workflow_dispatch
jobs:
  click:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]   # Intel test VMs have no graphics support and can't draw the open pad
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: brew install cliclick
      - name: Open the pad, screenshot it, click the pin button
        run: |
          NOTCHPAD_DEBUG=1 NOTCHPAD_DEBUG_OPEN=1 NOTCHPAD_NO_EFFECTS=1 NOTCHPAD_ALLOW_CAPTURE=1 \
            build/NotchPad.app/Contents/MacOS/NotchPad 2> app.log &
          sleep 5
          screencapture -x -R 560,0,800,360 open.png || true
          read X Y < <(grep NOTCHPAD_PIN_AT app.log | tail -1 | sed 's/.*x=\([0-9-]*\) y=\([0-9-]*\)/\1 \2/')
          echo "Clicking pin at $X,$Y"
          cliclick m:$X,$Y w:300 c:$X,$Y
          sleep 2
          screencapture -x -R 560,0,800,360 pinned.png || true
          cat app.log
          pgrep -x NotchPad >/dev/null && echo "still running" || echo "NOT RUNNING"
          grep -q "NOTCHPAD_PIN=true" app.log && echo "PIN CLICK WORKED" || { echo "PIN CLICK DID NOTHING"; exit 1; }
      - name: Themes - load a Ghostty theme file and show the gallery
        run: |
          C=~/Library/Containers/com.newzeebuild.notchpad/Data
          mkdir -p "$C/Library/Application Support/NotchPad/Themes"
          cp "tests/Ayu Mirage" "$C/Library/Application Support/NotchPad/Themes/"
          defaults write "$C/Library/Preferences/com.newzeebuild.notchpad" theme "custom:Ayu Mirage"
          defaults write "$C/Library/Preferences/com.newzeebuild.notchpad" keepOpen -bool true
          NOTCHPAD_DEBUG=1 NOTCHPAD_DEBUG_OPEN=1 NOTCHPAD_DEBUG_SETTINGS=1 NOTCHPAD_NO_EFFECTS=1 NOTCHPAD_ALLOW_CAPTURE=1 \
            build/NotchPad.app/Contents/MacOS/NotchPad 2> themes.log &
          sleep 7
          screencapture -x themes.png || true
          cat themes.log
          pkill -x NotchPad || true
          grep -q 'NOTCHPAD_THEMES custom=\["Ayu Mirage"\]' themes.log && echo "GHOSTTY THEME LOADED" || { echo "THEME NOT LOADED"; exit 1; }
      - name: Crash report
        if: always()
        run: |
          f=$(ls -t ~/Library/Logs/DiagnosticReports/NotchPad* 2>/dev/null | head -1) || true
          [ -n "$f" ] && python3 -c "import json,sys; t=open(sys.argv[1]).read().split('\n',1)[1]; d=json.loads(t); imgs=d['usedImages']; th=[x for x in d['threads'] if x.get('triggered')][0]; [print(i, imgs[fr['imageIndex']].get('name','?'), fr.get('symbol','?')) for i,fr in enumerate(th['frames'][:40])]" "$f" || echo "no crash report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: '*.png'
