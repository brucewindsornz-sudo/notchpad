name: Click test
on: workflow_dispatch
jobs:
  click:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: brew install cliclick
      - name: Open the pad, screenshot it, click the pin button
        run: |
          NOTCHPAD_DEBUG=1 NOTCHPAD_DEBUG_OPEN=1 NOTCHPAD_NO_EFFECTS=1 NOTCHPAD_ALLOW_CAPTURE=1 \
            build/NotchPad.app/Contents/MacOS/NotchPad 2> app.log &
          sleep 5
          screencapture -x -R 560,0,800,360 open.png || true
          read X Y < <(grep NOTCHPAD_PIN_AT app.log | tail -1 | sed 's/.*x=\([0-9-]*\) y=\([0-9-]*\)/\1 \2/')
          echo "Clicking pin at $X,$Y"
          cliclick m:$X,$Y w:300 c:$X,$Y
          sleep 2
          screencapture -x -R 560,0,800,360 pinned.png || true
          cat app.log
          pgrep -x NotchPad >/dev/null && echo "still running" || echo "NOT RUNNING"
          grep -q "NOTCHPAD_PIN=true" app.log && echo "PIN CLICK WORKED" || { echo "PIN CLICK DID NOTHING"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '*.png'
