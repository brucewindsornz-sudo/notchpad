name: Click test
on: workflow_dispatch
jobs:
  click:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: brew install cliclick
      - name: Open the pad and click the pin button
        run: |
          NOTCHPAD_DEBUG=1 NOTCHPAD_DEBUG_OPEN=1 build/NotchPad.app/Contents/MacOS/NotchPad 2> app.log &
          sleep 5
          cat app.log
          read X Y < <(grep -m1 NOTCHPAD_PIN_AT app.log | sed 's/.*x=\([0-9-]*\) y=\([0-9-]*\)/\1 \2/')
          echo "Clicking pin at $X,$Y"
          cliclick m:$X,$Y w:300 c:$X,$Y
          sleep 2
          cat app.log
          kill %1 || true
          grep -q "NOTCHPAD_PIN=true" app.log && echo "PIN CLICK WORKED" || { echo "PIN CLICK DID NOTHING"; exit 1; }
